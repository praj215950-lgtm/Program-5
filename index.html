<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS3 Column Features</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background-color: #f4f4f4;
}
h1 {
text-align: center;
color: darkblue;
column-span: all;
}
.columns {
column-count: 3;
column-gap: 30px;
column-rule: 3px solid gray;
text-align: justify;
padding: 15px;
background-color: white;
}
</style>
</head>
